name: Release CLI

# Push a `vX.Y.Z` tag → build the `ops` binary for every supported host + publish
# a GitHub Release. install.sh downloads `ops-<os>-<arch>.tar.gz` for the running
# host, so the asset names below MUST match install.sh's map — notably
# `ops-linux-arm64`, which was previously never built (→ 404 on ARM Linux nodes).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: ${{ matrix.asset_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: ops-linux-amd64
          # Native ARM64 Linux runner (no cross-linker hassle). install.sh already
          # expects this asset; without it ARM Linux installs 404. NOTE: ARM runners
          # are free on public repos, metered on private ones.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_name: ops-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: ops-darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: ops-darwin-arm64
          # Windows 也打 tar.gz (内含 ops.exe): Win10+ 自带 tar.exe, 且 self_update
          # 的解包逻辑全平台走同一条 Tar(Gz) 路径, 不用为 zip 多拉一套 feature
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: ops-windows-amd64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package + checksum
        shell: bash
        run: |
          bin_name="ops"
          if [[ "${{ matrix.os }}" == windows-* ]]; then bin_name="ops.exe"; fi
          bin="target/${{ matrix.target }}/release/$bin_name"
          strip "$bin" 2>/dev/null || true   # smaller binary (best-effort; no-op on Windows)
          tar -C "$(dirname "$bin")" -czf "${{ matrix.asset_name }}.tar.gz" "$bin_name"
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${{ matrix.asset_name }}.tar.gz" > "${{ matrix.asset_name }}.tar.gz.sha256"
          else
            sha256sum "${{ matrix.asset_name }}.tar.gz" > "${{ matrix.asset_name }}.tar.gz.sha256"
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.tar.gz.sha256
