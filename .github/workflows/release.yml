name: Release CLI

# Push a `vX.Y.Z` tag → build the `ops` binary for every supported host + publish
# a GitHub Release. install.sh downloads `ops-<os>-<arch>.tar.gz` for the running
# host, so the asset names below MUST match install.sh's map — notably
# `ops-linux-arm64`, which was previously never built (→ 404 on ARM Linux nodes).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: ${{ matrix.asset_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: ops-linux-amd64
          # Native ARM64 Linux runner (no cross-linker hassle). install.sh already
          # expects this asset; without it ARM Linux installs 404. NOTE: ARM runners
          # are free on public repos, metered on private ones.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_name: ops-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: ops-darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: ops-darwin-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package + checksum
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/ops"
          strip "$bin" || true   # smaller binary (best-effort; native build so strip matches)
          tar -C "$(dirname "$bin")" -czf "${{ matrix.asset_name }}.tar.gz" ops
          shasum -a 256 "${{ matrix.asset_name }}.tar.gz" > "${{ matrix.asset_name }}.tar.gz.sha256"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.tar.gz.sha256
